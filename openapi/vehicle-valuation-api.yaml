            $ref: '#/components/schemas/CatalogRef'
    CatalogTrimsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CatalogTrims'
    VersionInferenceRequest:
      type: object
      additionalProperties: false
      required: [mark, model, year, text]
      properties:
        mark:
          type: string
          description: Texto de la marca tal como lo devuelve el catálogo.
        model:
          type: string
          description: Texto del modelo tal como lo devuelve el catálogo.
        year:
          type: integer
          description: Año del vehículo (entre 1900 y año actual + 1).
        text:
          type: string
          description: Texto libre para inferir la versión (1 a 200 caracteres tras recortar espacios).
        limit:
          type: integer
          minimum: 1
          maximum: 20
          description: Cantidad máxima de versiones a devolver (1 a 20, por defecto 5).
    InferredTrim:
      type: object
      additionalProperties: true
      required: [version, confidence]
      properties:
        version:
          type: string
          description: Texto exacto de la versión en el catálogo.
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Preferencia relativa entre candidatos (0 a 100, suma 100 sobre el conjunto completo).
    VersionInferenceResult:
      type: object
      additionalProperties: true
      required: [catalogVersion, outcome, totalCandidates, versions]
      oneOf:
        - required: [outcome, versionConfidence, versionBasis]
          properties:
            outcome: { type: string, enum: [matched] }
        - required: [outcome]
          properties:
            outcome: { type: string, enum: [no_match] }
          not:
            anyOf:
              - required: [versionConfidence]
              - required: [versionBasis]
      properties:
        catalogVersion:
          type: string
          description: Hash o identificador de versión del catálogo consultado.
        outcome:
          type: string
          enum: [matched, no_match]
          description: Resultado del análisis sobre el texto proporcionado.
        totalCandidates:
          type: integer
          description: Total de candidatos compatibles antes de limitar la lista devuelta.
        versionConfidence:
          type: string
          enum: [EXACT, HIGH, MEDIUM, LOW]
          description: >-
            Obligatorio cuando outcome es matched. Nivel de confianza en la identificación de la versión seleccionada.
            EXACT indica que la versión llegó explícita y existe en el catálogo;
            HIGH, que el texto deja una sola versión;
            MEDIUM, que el texto aporta al menos un dato mecánico y se eligió la versión base más común
            del mercado (o la más barata entre las igual de comunes), que además representa una parte
            relevante de los avisos;
            LOW, la misma elección pero con poca información o pocos datos de mercado.
            El nivel bajo mide la identificación de la versión, no el riesgo de la tasación.
            Se omite con outcome no_match.
        versionBasis:
          type: string
          enum: [TEXT, MOST_COMMON, LOWEST_PRICE, SIMPLEST]
          description: >-
            Obligatorio cuando outcome es matched. Criterio aplicado para la selección de la versión.
            TEXT indica selección por evidencia textual o especificación directa;
            MOST_COMMON, versión con más avisos del mercado;
            LOWEST_PRICE, desempate por menor precio mediano de mercado;
            SIMPLEST, desempate por versión base o más simple del catálogo.
            Se omite con outcome no_match.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/InferredTrim'
    VersionInferenceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/VersionInferenceResult'
    VehicleResolutionRequest:
      type: object
      additionalProperties: false
      required: [mark, year]
      oneOf:
        - required: [model, version]
          not:
            required: [search]
        - required: [search]
          not:
            anyOf:
              - required: [model]
              - required: [version]
      properties:
        mark:
          type: string
        year:
          type: integer
        model:
          type: string
        version:
          type: string
        search:
          type: string
          minLength: 1
          maxLength: 200
        odometerKm:
          type: integer
          minimum: 0
        region:
          type: string
    VehicleResolutionResult:
      type: object
      additionalProperties: true
      required: [mark, model, year, version, region, odometerKm, resolution]
      properties:
        mark: { type: string }
        model: { type: string }
        year: { type: integer }
        version: { type: string }
        region: { type: string, description: Vacía para precio nacional. }
        odometerKm: { type: integer }
        resolution:
          $ref: '#/components/schemas/Resolution'
    Resolution:
      type: object
      additionalProperties: true
      required: [catalogVersion, sourceCatalogVersion, referenceYear, versionConfidence, versionBasis, fields, selected, alternatives]
      properties:
        catalogVersion: { type: string }
        sourceCatalogVersion: { type: string }
        usageCurveVersion: { type: string }
        referenceYear: { type: integer }
        search: { type: string }
        versionConfidence:
          type: string
          enum: [EXACT, HIGH, MEDIUM, LOW]
          description: >-
            Confianza en la versión elegida; es obligatoria en una resolución exitosa.
            EXACT indica que la versión llegó explícita y existe en el catálogo;
            HIGH, que el texto deja una sola versión;
            MEDIUM, que el texto aporta al menos un dato mecánico y se eligió la versión base más común
            del mercado (o la más barata entre las igual de comunes), que además representa una parte
            relevante de los avisos;
            LOW, la misma elección pero con poca información o pocos datos de mercado.
            El nivel bajo mide la identificación de la versión, no el riesgo de la tasación.
        versionBasis:
          type: string
          enum: [TEXT, MOST_COMMON, LOWEST_PRICE, SIMPLEST]
          description: >-
            Base de selección de la versión; es obligatoria en una resolución exitosa.
            TEXT indica selección por evidencia textual o especificación directa;
            MOST_COMMON, versión con más avisos del mercado;
            LOWEST_PRICE, desempate por menor precio mediano de mercado;
            SIMPLEST, desempate por versión base o más simple del catálogo.
        fields:
          type: object
          additionalProperties: true
          required: [model, version, region, odometerKm]
          properties:
            model: { $ref: '#/components/schemas/ResolvedStringField' }
            version: { $ref: '#/components/schemas/ResolvedStringField' }
            region: { $ref: '#/components/schemas/ResolvedStringField' }
            odometerKm:
              $ref: '#/components/schemas/ResolvedNumberField'
              description: Kilometraje resuelto del vehículo en kilómetros.
        selected:
          $ref: '#/components/schemas/ResolutionCandidate'
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/ResolutionCandidate' }
    OrderStatusResolution:
      type: object
      additionalProperties: true
      required: [catalogVersion, sourceCatalogVersion, referenceYear, fields, selected, alternatives]
      properties:
        catalogVersion: { type: string }
        sourceCatalogVersion: { type: string }
        usageCurveVersion: { type: string }
        referenceYear: { type: integer }
        search: { type: string }
        versionConfidence:
          type: string
          enum: [EXACT, HIGH, MEDIUM, LOW]
          description: >-
            Confianza en la versión; se omite en pedidos antiguos que no persistieron este dato.
            EXACT indica que la versión llegó explícita y existe en el catálogo;
            HIGH, que el texto deja una sola versión;
            MEDIUM, que el texto aporta al menos un dato mecánico y se eligió la versión base más común
            del mercado (o la más barata entre las igual de comunes), que además representa una parte
            relevante de los avisos;
            LOW, la misma elección pero con poca información o pocos datos de mercado.
            El nivel bajo mide la identificación de la versión, no el riesgo de la tasación.
        versionBasis:
          type: string
          enum: [TEXT, MOST_COMMON, LOWEST_PRICE, SIMPLEST]
          description: >-
            Base de selección; se omite en pedidos antiguos que no persistieron este dato.
            TEXT indica selección por evidencia textual o especificación directa;
            MOST_COMMON, versión con más avisos del mercado;
            LOWEST_PRICE, desempate por menor precio mediano de mercado;
            SIMPLEST, desempate por versión base o más simple del catálogo.
        fields:
          type: object
          additionalProperties: true
          required: [model, version, region, odometerKm]
          properties:
            model: { $ref: '#/components/schemas/ResolvedStringField' }
            version: { $ref: '#/components/schemas/ResolvedStringField' }
            region: { $ref: '#/components/schemas/ResolvedStringField' }
            odometerKm:
              $ref: '#/components/schemas/ResolvedNumberField'
              description: Kilometraje resuelto del vehículo en kilómetros.
        selected:
          $ref: '#/components/schemas/ResolutionCandidate'
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/ResolutionCandidate' }
    ResultResolution:
      type: object
      description: >-
        Resolución incluida dentro del resultado (`result.resolution`). El kilometraje va en
        `fields.odometer` y no incluye `versionConfidence` ni `versionBasis`.
      additionalProperties: true
      required: [catalogVersion, sourceCatalogVersion, referenceYear, fields, selected, alternatives]
      properties:
        catalogVersion: { type: string }
        sourceCatalogVersion: { type: string }
        usageCurveVersion: { type: string }
        referenceYear: { type: integer }
        search: { type: string }
        fields:
          type: object
          additionalProperties: true
          required: [model, version, region, odometer]
          properties:
            model: { $ref: '#/components/schemas/ResolvedStringField' }
            version: { $ref: '#/components/schemas/ResolvedStringField' }
            region: { $ref: '#/components/schemas/ResolvedStringField' }
            odometer:
              $ref: '#/components/schemas/ResolvedNumberField'
              description: Kilometraje resuelto del vehículo en kilómetros.
        selected:
          $ref: '#/components/schemas/ResolutionCandidate'
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/ResolutionCandidate' }
    ResolvedStringField:
      type: object
      additionalProperties: true
      required: [value, source]
      properties:
        value: { type: string }
        source: { type: string, enum: [EXACT, INFERRED, NATIONAL] }
    ResolvedNumberField:
      type: object
      additionalProperties: true
      required: [value, source]
      properties:
        value: { type: integer }
        source: { type: string, enum: [PROVIDED, USAGE_CURVE_YEAR_MEDIAN, USAGE_CURVE_MODEL_MEDIAN] }
    ResolutionCandidate:
      type: object
      additionalProperties: true
      required: [model, version, confidence]
      properties:
        model: { type: string }
        version: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
    MarkInferenceRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
    MarkCandidate:
      type: object
      additionalProperties: true
      required: [mark, name, confidence]
      properties:
        mark: { type: string }
        name: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
    MarkInferenceResult:
      type: object
      additionalProperties: true
      required: [catalogVersion, outcome, totalCandidates, marks]
      properties:
        catalogVersion: { type: string }
        outcome: { type: string, enum: [matched, no_match] }
        totalCandidates: { type: integer }
        marks: { type: array, items: { $ref: '#/components/schemas/MarkCandidate' } }
    MarkInferenceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/MarkInferenceResult' }
    ModelInferenceRequest:
      type: object
      additionalProperties: false
      required: [mark, year, text]
      properties:
        mark: { type: string }
        year: { type: integer }
        text: { type: string, minLength: 1, maxLength: 200 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
    ModelCandidate:
      type: object
      additionalProperties: true
      required: [model, name, confidence]
      properties:
        model: { type: string }
        name: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
    ModelInferenceResult:
      type: object
      additionalProperties: true
      required: [catalogVersion, outcome, totalCandidates, models]
      properties:
        catalogVersion: { type: string }
        outcome: { type: string, enum: [matched, no_match] }
        totalCandidates: { type: integer }
        models: { type: array, items: { $ref: '#/components/schemas/ModelCandidate' } }
    ModelInferenceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/ModelInferenceResult' }
    VehicleResolutionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/VehicleResolutionResult' }
