openapi: 3.0.3
info:
  title: Autotia Vehicle Valuation API
  version: 2.0.0
  description: |
    API B2B de tasación vehicular de Autotia (Chile). Este archivo es la copia del contrato que usan los SDK
    oficiales para escribir sus tipos y su suite de conformidad; no se genera código a partir de él.

    - La tasación es asíncrona: `POST /v1/orders` acepta la solicitud y
      `GET /v1/orders/{orderId}` consulta el estado hasta un estado terminal.
    - Todas las respuestas de la API usan el envelope estándar `data`, `apiRequestId`, `executionId`,
      `durationMs`; `error` solo aparece en errores y `pageToken` no se usa en v1.
    - La pasarela de entrada puede rechazar una solicitud (401 por token ausente o inválido, 403 por scope
      insuficiente, 429 por límite de tasa) **antes** de invocar el servicio. Esas respuestas pueden no usar el
      envelope y su cuerpo no es parte del contrato: el cliente debe clasificarlas por estado HTTP.
    - Los valores de dinero están en CLP.
servers:
  - url: https://api.dev.autotia.com/public-secure/shop-b2b
    description: URL esperada de desarrollo. La IaC configura el mapping y obtiene el dominio personalizado de la configuración del stage.
  - url: https://api.autotia.com/public-secure/shop-b2b
    description: URL esperada de producción. La IaC configura el mapping y obtiene el dominio personalizado de la configuración del stage; disponibilidad del entorno pendiente de verificar.
security:
  - oauth2ClientCredentials: []
tags:
  - name: orders
    description: Pedidos de tasación vehicular asíncronos.
  - name: catalog
    description: Catálogo de marcas, modelos, años y versiones.
paths:
  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Solicita un pedido de tasación
      description: |
        Requiere el scope `https://api.autotia.com/reports/vehicle-valuation.read`.

        `reportType`, `mark` y `year` son obligatorios. Debe enviarse `model` y `version` juntos, o `search` sin
        `model` ni `version`. `odometerKm` y `region` son opcionales; la región omitida o vacía solicita precio
        nacional. `search` acepta entre 1 y 200 caracteres tras recortar espacios y `odometerKm` es un entero de
        0 a 1.000.000. Una identidad no reconocida puede terminar luego en un estado `FAILED`.

        `Idempotency-Key` es opcional. Sin ella cada POST es una solicitud nueva. Con ella, repetir la misma
        clave y el mismo cuerpo reutiliza el pedido existente (la respuesta refleja su estado actual, puede ser
        200 si ya terminó) y repetir la clave con otro cuerpo responde 400 `invalid_request`. El registro de idempotencia dura
        24 horas. El largo máximo de la clave no está confirmado; se recomienda una clave corta y imprimible.

        Si falla la comunicación interna después de aceptar la solicitud, la respuesta sigue siendo 202
        `PENDING`: el `orderId` devuelto es el que se consulta y puede resolverse luego a otro identificador
        en las respuestas del GET.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave de idempotencia estable entre reintentos de la misma solicitud.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '202':
          description: Solicitud aceptada y en proceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceEnvelope'
        '200':
          description: |
            Repetición idempotente de una solicitud cuyo pedido ya terminó. Devuelve el estado terminal con el
            mismo shape que el GET: `COMPLETED` con `result` o `FAILED` con `failure`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Consulta el estado de un pedido
      description: |
        Requiere el scope `https://api.autotia.com/reports/vehicle-valuation.read`.

        Mientras el pedido está en proceso responde 202 con `PENDING` o `RUNNING` y **sin** `pollAfterMs`
        (el intervalo sugerido solo viaja en la respuesta del POST: 2000 ms). Al terminar responde 200 con
        `COMPLETED` y `result`, o con `FAILED` y `failure`: un fallo terminal es una respuesta exitosa del
        polling. La consulta solo lee; no inicia cálculos. Un pedido de otra empresa o inexistente se informa
        igual: 404.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Identificador del pedido con prefijo `ordb2b_`.
          schema:
            type: string
      responses:
        '202':
          description: El pedido sigue en proceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '200':
          description: El pedido terminó (`COMPLETED` o `FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pedido inexistente o de otra empresa. Código `invalid_request`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/catalog:
    get:
      tags: [catalog]
      operationId: listMarks
      summary: Lista las marcas
      description: Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Marcas del catálogo.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogMarksEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/catalog/{mark}:
    get:
      tags: [catalog]
      operationId: listModels
      summary: Lista los modelos de una marca
      description: Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
      parameters:
        - $ref: '#/components/parameters/Mark'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Modelos de la marca, con los años disponibles de cada uno.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModelsEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/catalog/{mark}/{model}:
    get:
      tags: [catalog]
      operationId: listYears
      summary: Lista los años de un modelo
      description: Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
      parameters:
        - $ref: '#/components/parameters/Mark'
        - $ref: '#/components/parameters/Model'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Años disponibles del modelo.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogYearsEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/catalog/{mark}/{model}/{year}:
    get:
      tags: [catalog]
      operationId: listTrims
      summary: Lista las versiones de un modelo y año
      description: |
        Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
        Un año válido sin versiones responde 200 con `trims` vacío. Un `year` no entero responde 404 con código
        `invalid_request`.
      parameters:
        - $ref: '#/components/parameters/Mark'
        - $ref: '#/components/parameters/Model'
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Versiones disponibles.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTrimsEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/version-inference:
    post:
      tags: [catalog]
      operationId: inferTrim
      summary: Infiere las versiones del catálogo a partir de marca, modelo, año y texto libre
      description: |
        Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.

        A partir de la marca, modelo, año y un texto descriptivo libre, devuelve las versiones más probables
        del catálogo oficial ordenadas por preferencia relativa (`confidence`). El valor de cada versión
        devuelta puede enviarse directamente en el campo `version` de `POST /v1/orders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInferenceRequest'
      responses:
        '200':
          description: Resultado de la inferencia de versiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInferenceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Marca (`mark_not_found`), modelo (`model_not_found`) o año (`year_not_found`) no encontrado en el catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/vehicle-resolution:
    post:
      tags: [catalog]
      operationId: resolveVehicle
      summary: Resuelve el vehículo, la región y el kilometraje de una solicitud
      description: Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleResolutionRequest'
      responses:
        '200':
          description: Vehículo resuelto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResolutionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mark-inference:
    post:
      tags: [catalog]
      operationId: inferMark
      summary: Infiere marcas a partir de texto libre
      description: Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkInferenceRequest'
      responses:
        '200':
          description: Resultado de la inferencia de marcas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkInferenceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/model-inference:
    post:
      tags: [catalog]
      operationId: inferModel
      summary: Infiere modelos a partir de marca, año y texto libre
      description: Requiere el scope `https://api.autotia.com/reports/vehicle-catalog.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInferenceRequest'
      responses:
        '200':
          description: Resultado de la inferencia de modelos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInferenceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 `client_credentials` con HTTP Basic (`client_id:client_secret`) y cuerpo
        `application/x-www-form-urlencoded` (`grant_type=client_credentials&scope=...`). Respuesta:
        `access_token`, `token_type` (`Bearer`) y `expires_in` en segundos. Cada ambiente tiene credenciales
        propias. El tiempo de vida del token no está fijado por este contrato: usar siempre `expires_in`.
        En desarrollo, el endpoint está confirmado por la configuración IaC. La configuración de producción define el mismo patrón, pero el entorno desplegado no fue verificado y su URL queda pendiente.
      x-token-urls:
        dev:
          url: https://prdrpt-b2b-dev.auth.us-east-1.amazoncognito.com/oauth2/token
          confirmed: true
        prod:
          status: pending
          reason: No se confirmó el endpoint de token de un entorno de producción desplegado.
      flows:
        clientCredentials:
          tokenUrl: https://prdrpt-b2b-dev.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            https://api.autotia.com/reports/vehicle-valuation.read: Solicitar y consultar tasaciones.
            https://api.autotia.com/reports/vehicle-catalog.read: Consultar el catálogo vehicular.
  parameters:
    Mark:
      name: mark
      in: path
      required: true
      description: Clave (`key`) de la marca devuelta por el catálogo.
      schema:
        type: string
    Model:
      name: model
      in: path
      required: true
      description: Clave (`key`) del modelo devuelta por el catálogo.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag previo para revalidar. Si coincide, la respuesta es 304 sin cuerpo.
      schema:
        type: string
  headers:
    ETag:
      description: Versión del catálogo entre comillas.
      schema:
        type: string
    CacheControl:
      description: Siempre `private, max-age=0, must-revalidate`.
      schema:
        type: string
  responses:
    NotModified:
      description: El `ETag` enviado coincide con la versión vigente. Sin cuerpo.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    BadRequest:
      description: JSON inválido o `reportType`, `year` u `odometerKm` ausentes o inválidos. Código `invalid_request`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: |
        Token ausente, inválido o vencido. Lo normal es que lo emita la pasarela sin envelope (cuerpo no
        contractual); si lo emite el servicio usa el código `unauthorized`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOrGatewayBody'
    Forbidden:
      description: |
        Scope insuficiente (la pasarela puede responder sin envelope) o credencial/empresa suspendida
        (`client_suspended`; también `forbidden` si lo emite el servicio).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOrGatewayBody'
    CatalogNotFound:
      description: |
        Marca (`mark_not_found`) o modelo (`model_not_found`) inexistente, o ruta inválida (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: |
        Dos casos con el mismo estado. (1) Cuota diaria agotada, con envelope y código `quota_exceeded`
        (credencial) o `company_quota_exceeded` (empresa): no se resuelve reintentando de inmediato.
        (2) Límite de tasa de la pasarela, normalmente sin envelope: se resuelve esperando y reintentando.
        Límites de tasa: POST de tasación 1 solicitud por segundo (ráfaga 5); GET de estado 20 por segundo
        (ráfaga 40); rutas de catálogo 50 por segundo (ráfaga 100 por ruta).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOrGatewayBody'
    ServiceUnavailable:
      description: Falla temporal. Código `service_unavailable`. Reintentable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: Tiempo de espera agotado al consultar el catálogo. Código `upstream_timeout`. Reintentable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    EnvelopeMeta:
      type: object
      required: [apiRequestId, executionId, durationMs]
      properties:
        apiRequestId:
          type: string
          description: Identificador de la solicitud en la pasarela. Citarlo al contactar a soporte.
        executionId:
          type: string
        durationMs:
          type: integer
          format: int64
        pageToken:
          type: string
          description: No se usa en v1.
    ErrorCode:
      type: string
      description: |
        Vocabulario público de `error.code`. `data_unavailable` se informa dentro de `data.failure` cuando una
        tasación termina en estado `FAILED` con HTTP 200; no es una respuesta HTTP 422.
      enum:
        - invalid_request
        - unauthorized
        - forbidden
        - client_suspended
        - vehicle_not_found
        - data_unavailable
        - mark_not_found
        - model_not_found
        - year_not_found
        - odometer_required
        - quota_exceeded
        - company_quota_exceeded
        - service_unavailable
        - upstream_timeout
    ApiError:
      type: object
      required: [code, description]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        description:
          type: string
          description: Texto legible en español.
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data, error]
          properties:
            data:
              type: object
              nullable: true
              description: Siempre `null` en un error.
            error:
              $ref: '#/components/schemas/ApiError'
    GatewayBody:
      type: object
      description: Cuerpo de una respuesta de la pasarela. No es contractual; puede venir vacío o con otro formato.
      additionalProperties: true
    ErrorOrGatewayBody:
      oneOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - $ref: '#/components/schemas/GatewayBody'
    OrderRequest:
      type: object
      additionalProperties: false
      required: [reportType, mark, year]
      oneOf:
        - required: [model, version]
          not:
            required: [search]
        - required: [search]
          not:
            anyOf:
              - required: [model]
              - required: [version]
      properties:
        reportType:
          type: string
          enum: [general-price]
          description: Tipo de informe solicitado.
        mark:
          type: string
          description: Texto (`text`) de la marca tal como lo devuelve el catálogo.
        model:
          type: string
          description: Texto (`text`) del modelo tal como lo devuelve el catálogo.
        search:
          type: string
          minLength: 1
          maxLength: 200
          description: Texto para resolver modelo y versión; excluye `model` y `version`.
        year:
          type: integer
        version:
          type: string
          description: Texto (`text`) de la versión tal como lo devuelve el catálogo.
        odometerKm:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Kilometraje en kilómetros.
        region:
          type: string
          description: Región opcional; omitida o vacía significa precio nacional.
    OrderState:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
    Acceptance:
      type: object
      additionalProperties: true
      required: [orderId, reportType, status, pollAfterMs]
      properties:
        orderId:
          type: string
          description: Identificador del pedido con prefijo `ordb2b_`.
        reportType:
          type: string
          description: Eco del tipo de informe pedido.
        status:
          type: string
          enum: [PENDING, RUNNING]
        pollAfterMs:
          type: integer
          description: Intervalo sugerido antes de consultar el estado. Hoy es siempre 2000.
        saleId:
          type: string
          description: Identificador de la venta asociada con prefijo `sal_` (se omite si aún no está asociada).
        resolution:
          $ref: '#/components/schemas/Resolution'
    AcceptanceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Acceptance'
    FailureCode:
      type: string
      description: Códigos que puede tener un fallo terminal; cualquier otro se informa como `service_unavailable`.
      enum:
        - invalid_request
        - vehicle_not_found
        - data_unavailable
        - service_unavailable
        - upstream_timeout
    Failure:
      type: object
      additionalProperties: true
      required: [code, description]
      properties:
        code:
          $ref: '#/components/schemas/FailureCode'
        description:
          type: string
    OrderStatus:
      type: object
      additionalProperties: true
      description: |
        `result` solo está presente en `COMPLETED` y `failure` solo en `FAILED`. `saleId` se omite si la venta aún no está asociada.
      required: [orderId, reportType, status]
      properties:
        orderId:
          type: string
          description: Identificador del pedido con prefijo `ordb2b_`.
        reportType:
          type: string
          description: Eco del tipo de informe pedido.
        status:
          $ref: '#/components/schemas/OrderState'
        saleId:
          type: string
          description: Identificador de la venta asociada con prefijo `sal_` (se omite si aún no está asociada).
        result:
          $ref: '#/components/schemas/OrderResult'
        failure:
          $ref: '#/components/schemas/Failure'
        resolution:
          $ref: '#/components/schemas/Resolution'
    StatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/OrderStatus'
    OrderResult:
      type: object
      additionalProperties: true
      required: [schemaVersion, data]
      properties:
        schemaVersion:
          type: string
          enum: [general-price-result-v1]
        data:
          $ref: '#/components/schemas/OrderResultData'
    OrderResultData:
      type: object
      additionalProperties: true
      required: [vehicle, marketContext, purchase, sale, grossMarginEstimate, freshness, methodology]
      properties:
        vehicle:
          $ref: '#/components/schemas/ResultVehicle'
        marketContext:
          $ref: '#/components/schemas/MarketContext'
        purchase:
          $ref: '#/components/schemas/PriceSide'
        sale:
          $ref: '#/components/schemas/PriceSide'
        grossMarginEstimate:
          $ref: '#/components/schemas/GrossMarginEstimate'
        freshness:
          $ref: '#/components/schemas/Freshness'
        methodology:
          $ref: '#/components/schemas/Methodology'
    ResultVehicle:
      type: object
      additionalProperties: true
      required: [mark, model, year, version, versionResolution, versionApplied]
      properties:
        mark:
          type: string
        model:
          type: string
        year:
          type: integer
        version:
          type: string
        canonicalVersion:
          type: string
          description: Versión canónica del catálogo; se omite si no se resolvió.
        versionResolution:
          type: string
        versionApplied:
          type: boolean
    MarketContext:
      type: object
      additionalProperties: true
      required: [region, purchaseSellerType, saleSellerType, odometerKm]
      properties:
        region:
          type: string
        purchaseSellerType:
          type: string
        saleSellerType:
          type: string
        odometerKm:
          type: integer
    PriceSide:
      type: object
      additionalProperties: true
      required: [sellerType, qualityScore, options]
      properties:
        sellerType:
          type: string
        qualityScore:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/PriceOption'
    PriceOption:
      type: object
      additionalProperties: true
      required: [percentile, priceCLP]
      properties:
        percentile:
          type: integer
        priceCLP:
          type: integer
          format: int64
    GrossMarginEstimate:
      type: object
      additionalProperties: true
      required: [qualityScore, disclaimer, maxMargin, minMargin]
      properties:
        qualityScore:
          type: integer
        disclaimer:
          type: string
        maxMargin:
          $ref: '#/components/schemas/MarginRange'
        minMargin:
          $ref: '#/components/schemas/MarginRange'
    MarginRange:
      type: object
      additionalProperties: true
      required: [purchasePercentile, salePercentile, purchasePriceCLP, salePriceCLP, marginCLP, marginPercent]
      properties:
        purchasePercentile:
          type: integer
        salePercentile:
          type: integer
        purchasePriceCLP:
          type: integer
          format: int64
        salePriceCLP:
          type: integer
          format: int64
        marginCLP:
          type: integer
          format: int64
        marginPercent:
          type: number
          format: double
    Freshness:
      type: object
      additionalProperties: true
      required: [lastValidLogicalDay, ageDays, status]
      properties:
        lastValidLogicalDay:
          type: string
          description: Fecha lógica `YYYY-MM-DD`.
        ageDays:
          type: integer
        status:
          type: string
    Methodology:
      type: object
      additionalProperties: true
      required: [qualityVersion, smoothingVersion, algorithmVersion]
      properties:
        qualityVersion:
          type: string
        smoothingVersion:
          type: string
        algorithmVersion:
          type: string
    CatalogRef:
      type: object
      additionalProperties: true
      required: [key, text]
      properties:
        key:
          type: string
          description: Clave para usar en las rutas del catálogo.
        text:
          type: string
          description: Texto para usar en el cuerpo de una solicitud de tasación.
    CatalogMarks:
      type: object
      additionalProperties: true
      required: [catalogVersion, marks]
      properties:
        catalogVersion:
          type: string
        marks:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRef'
    CatalogMarksEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CatalogMarks'
    CatalogModel:
      allOf:
        - $ref: '#/components/schemas/CatalogRef'
        - type: object
          required: [years]
          properties:
            years:
              type: array
              items:
                type: integer
    CatalogModels:
      type: object
      additionalProperties: true
      required: [catalogVersion, mark, models]
      properties:
        catalogVersion:
          type: string
        mark:
          $ref: '#/components/schemas/CatalogRef'
        models:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModel'
    CatalogModelsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CatalogModels'
    CatalogYears:
      type: object
      additionalProperties: true
      required: [catalogVersion, mark, model, years]
      properties:
        catalogVersion:
          type: string
        mark:
          $ref: '#/components/schemas/CatalogRef'
        model:
          $ref: '#/components/schemas/CatalogRef'
        years:
          type: array
          items:
            type: integer
    CatalogYearsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CatalogYears'
    CatalogTrims:
      type: object
      additionalProperties: true
      required: [catalogVersion, mark, model, year, trims]
      properties:
        catalogVersion:
          type: string
        mark:
          $ref: '#/components/schemas/CatalogRef'
        model:
          $ref: '#/components/schemas/CatalogRef'
        year:
          type: integer
        trims:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRef'
    CatalogTrimsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CatalogTrims'
    VersionInferenceRequest:
      type: object
      additionalProperties: false
      required: [mark, model, year, text]
      properties:
        mark:
          type: string
          description: Texto de la marca tal como lo devuelve el catálogo.
        model:
          type: string
          description: Texto del modelo tal como lo devuelve el catálogo.
        year:
          type: integer
          description: Año del vehículo (entre 1900 y año actual + 1).
        text:
          type: string
          description: Texto libre para inferir la versión (1 a 200 caracteres tras recortar espacios).
        limit:
          type: integer
          minimum: 1
          maximum: 20
          description: Cantidad máxima de versiones a devolver (1 a 20, por defecto 5).
    InferredTrim:
      type: object
      additionalProperties: true
      required: [version, confidence, score]
      properties:
        version:
          type: string
          description: Texto exacto de la versión en el catálogo.
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Preferencia relativa entre candidatos (0 a 100, suma 100 sobre el conjunto completo).
        score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Preferencia relativa normalizada, no es probabilidad de acierto.
    VersionInferenceResult:
      type: object
      additionalProperties: true
      required: [catalogVersion, outcome, totalCandidates, topMargin, versions]
      properties:
        catalogVersion:
          type: string
          description: Hash o identificador de versión del catálogo consultado.
        outcome:
          type: string
          enum: [matched, no_evidence, no_match]
          description: Resultado del análisis sobre el texto proporcionado.
        totalCandidates:
          type: integer
          description: Total de candidatos compatibles antes de limitar la lista devuelta.
        topMargin:
          type: number
          format: double
          description: Diferencia entre score del primer y segundo candidato antes de truncar.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/InferredTrim'
    VersionInferenceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/VersionInferenceResult'
    VehicleResolutionRequest:
      type: object
      additionalProperties: false
      required: [mark, year]
      oneOf:
        - required: [model, version]
          not:
            required: [search]
        - required: [search]
          not:
            anyOf:
              - required: [model]
              - required: [version]
      properties:
        mark:
          type: string
        year:
          type: integer
        model:
          type: string
        version:
          type: string
        search:
          type: string
          minLength: 1
          maxLength: 200
        odometerKm:
          type: integer
          minimum: 0
        region:
          type: string
    VehicleResolutionResult:
      type: object
      additionalProperties: true
      required: [mark, model, year, version, region, odometerKm, resolution]
      properties:
        mark: { type: string }
        model: { type: string }
        year: { type: integer }
        version: { type: string }
        region: { type: string, description: Vacía para precio nacional. }
        odometerKm: { type: integer }
        resolution:
          $ref: '#/components/schemas/Resolution'
    Resolution:
      type: object
      additionalProperties: true
      required: [catalogVersion, sourceCatalogVersion, referenceYear, certainty, topMargin, fields, selected, alternatives]
      properties:
        catalogVersion: { type: string }
        sourceCatalogVersion: { type: string }
        usageCurveVersion: { type: string }
        referenceYear: { type: integer }
        search: { type: string }
        certainty: { type: string, enum: [EXACT, HIGH, LOW] }
        topMargin: { type: number, format: double }
        fields:
          type: object
          additionalProperties: true
          required: [model, version, region, odometerKm]
          properties:
            model: { $ref: '#/components/schemas/ResolvedStringField' }
            version: { $ref: '#/components/schemas/ResolvedStringField' }
            region: { $ref: '#/components/schemas/ResolvedStringField' }
            odometerKm: { $ref: '#/components/schemas/ResolvedNumberField' }
        selected:
          $ref: '#/components/schemas/ResolutionCandidate'
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/ResolutionCandidate' }
    ResolvedStringField:
      type: object
      additionalProperties: true
      required: [value, source]
      properties:
        value: { type: string }
        source: { type: string, enum: [EXACT, INFERRED, NATIONAL] }
    ResolvedNumberField:
      type: object
      additionalProperties: true
      required: [value, source]
      properties:
        value: { type: integer }
        source: { type: string, enum: [PROVIDED, USAGE_CURVE_YEAR_MEDIAN, USAGE_CURVE_MODEL_MEDIAN] }
    ResolutionCandidate:
      type: object
      additionalProperties: true
      required: [model, version, confidence, score]
      properties:
        model: { type: string }
        version: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        score: { type: number, format: double, minimum: 0, maximum: 100 }
    MarkInferenceRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
    MarkCandidate:
      type: object
      additionalProperties: true
      required: [mark, name, confidence, score]
      properties:
        mark: { type: string }
        name: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        score: { type: number, format: double, minimum: 0, maximum: 100 }
    MarkInferenceResult:
      type: object
      additionalProperties: true
      required: [catalogVersion, outcome, totalCandidates, topMargin, marks]
      properties:
        catalogVersion: { type: string }
        outcome: { type: string, enum: [matched, no_match] }
        totalCandidates: { type: integer }
        topMargin: { type: number, format: double }
        marks: { type: array, items: { $ref: '#/components/schemas/MarkCandidate' } }
    MarkInferenceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/MarkInferenceResult' }
    ModelInferenceRequest:
      type: object
      additionalProperties: false
      required: [mark, year, text]
      properties:
        mark: { type: string }
        year: { type: integer }
        text: { type: string, minLength: 1, maxLength: 200 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
    ModelCandidate:
      type: object
      additionalProperties: true
      required: [model, name, confidence, score]
      properties:
        model: { type: string }
        name: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        score: { type: number, format: double, minimum: 0, maximum: 100 }
    ModelInferenceResult:
      type: object
      additionalProperties: true
      required: [catalogVersion, outcome, totalCandidates, topMargin, models]
      properties:
        catalogVersion: { type: string }
        outcome: { type: string, enum: [matched, no_match] }
        totalCandidates: { type: integer }
        topMargin: { type: number, format: double }
        models: { type: array, items: { $ref: '#/components/schemas/ModelCandidate' } }
    ModelInferenceEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/ModelInferenceResult' }
    VehicleResolutionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/VehicleResolutionResult' }
